<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Survey Control Room</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--bg:#07111f;--panel:rgba(13,27,45,.76);--panel2:rgba(17,34,55,.88);--line:rgba(137,181,216,.18);--text:#edf6ff;--muted:#91a8bc;--blue:#68b8ff;--cyan:#68e4e0;--pink:#ff879d;--green:#65d6a2;--shadow:0 25px 70px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans Thai","Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#12365b 0,transparent 32%),radial-gradient(circle at 90% 15%,#3a183b 0,transparent 30%),linear-gradient(135deg,#050b14,#091828 55%,#07111d);min-height:100vh}button,input,select,textarea{font:inherit}.app{min-height:100vh}.spot{position:fixed;inset:0;pointer-events:none;background:radial-gradient(500px circle at var(--mx,50%) var(--my,20%),rgba(104,184,255,.09),transparent 45%)}.nav{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:rgba(5,13,23,.78);backdrop-filter:blur(18px)}.navin{max-width:1280px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.brand img{width:38px;height:38px;padding:8px;border-radius:12px;background:linear-gradient(135deg,#1e547f,#18334f);box-shadow:0 0 28px #4aaeff22}.brand small{display:block;color:#7195b2;font-size:9px;letter-spacing:2px}.navbtns{display:flex;gap:8px;align-items:center}.navbtn{border:1px solid transparent;background:transparent;color:#91a8bc;padding:10px 13px;border-radius:12px;cursor:pointer;transition:.25s}.navbtn:hover,.navbtn.active{color:#fff;background:rgba(104,184,255,.1);border-color:rgba(104,184,255,.2);box-shadow:0 0 25px rgba(104,184,255,.08)}.navbtn img{width:18px;height:18px;vertical-align:middle;margin-right:7px;filter:brightness(1.15)}.logout{border-color:#ff879d33;color:#ffadba}.page{max-width:1280px;margin:auto;padding:34px 22px 70px}.hero{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:3px;color:#70a7ce;font-weight:700}.hero h1{font-size:clamp(2.1rem,5vw,4.5rem);line-height:.98;margin:10px 0 0;letter-spacing:-2px;background:linear-gradient(100deg,#fff,#9fd7ff 55%,#8fe5df);-webkit-background-clip:text;color:transparent}.sub{color:var(--muted);margin-top:12px}.live{font-size:12px;color:#8fa8bd;text-align:right}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 7px #65d6a21c;margin-right:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.glass{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(21,41,64,.84),rgba(8,20,34,.8));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.glass:before{content:"";position:absolute;inset:-1px;background:linear-gradient(120deg,transparent,rgba(255,255,255,.06),transparent);transform:translateX(-100%);transition:1s}.glass:hover:before{transform:translateX(100%)}.card{padding:21px;border-radius:18px;min-height:130px}.card small{color:#8fa8bd}.value{display:block;font-size:2.35rem;font-weight:800;margin-top:10px}.blue{color:#79c5ff}.cyan{color:#72e4df}.pink{color:#ff8fa3}.green{color:#69dca7}.grid{display:grid;grid-template-columns:1fr 1.45fr;gap:15px;margin-top:15px}.panel{padding:22px;border-radius:18px}.panel h2{font-size:16px;margin:0 0 20px}.bars{display:grid;gap:14px}.bar{display:grid;grid-template-columns:120px 1fr 35px;gap:10px;align-items:center;font-size:13px}.track{height:8px;background:#ffffff0b;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#5c9fe2,#72e4df);transition:width 1s cubic-bezier(.2,.8,.2,1)}.tablewrap{overflow:auto}.table{width:100%;min-width:620px;border-collapse:collapse}.table th{font-size:11px;color:#7795ad;text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:12px 10px;border-bottom:1px solid #ffffff09;font-size:13px}.badge{padding:4px 9px;border-radius:99px;background:#ffffff09}.ok{color:#69dca7}.no{color:#ff8fa3}.empty{text-align:center;color:var(--muted);padding:25px}.formShell{max-width:1050px;margin:25px auto;background:linear-gradient(145deg,rgba(14,31,50,.9),rgba(6,17,29,.9));border:1px solid var(--line);border-radius:26px;padding:clamp(22px,4vw,45px);box-shadow:var(--shadow)}.formTitle{font-size:clamp(1.8rem,4vw,3rem);line-height:1.1;margin:0;background:linear-gradient(90deg,#fff,#9dd7ff);-webkit-background-clip:text;color:transparent}.section{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025);transition:.25s}.section:hover{border-color:#68b8ff33;box-shadow:0 12px 40px #0000001c}.section h2{margin:0 0 15px;font-size:15px;color:#a9d7f8}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:700;color:#9bb1c4;margin-bottom:7px}.input{width:100%;padding:12px 14px;color:#eef7ff;background:#061321aa;border:1px solid #7395ae2b;border-radius:11px;outline:none;transition:.2s}.input:focus{border-color:#68b8ff77;box-shadow:0 0 0 4px #68b8ff12}.radio{padding:11px 13px;background:#061321aa;border-radius:11px;border:1px solid #7395ae2b}.radio label{display:inline-flex;gap:7px;margin-right:22px;color:#c7d8e5;font-size:13px}.formtable{width:100%;border-collapse:collapse}.formtable th,.formtable td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.formtable th{color:#82aac7;background:#ffffff05}.primary{width:100%;margin-top:24px;padding:15px;border:0;border-radius:14px;color:#04101b;font-weight:800;cursor:pointer;background:linear-gradient(100deg,#68b8ff,#72e4df);box-shadow:0 12px 35px #68b8ff22;transition:.2s}.primary:hover{transform:translateY(-2px);box-shadow:0 18px 45px #68b8ff38}.status{display:block;text-align:center;color:#7ea2bb;margin-top:12px}.login{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:30px}.loginbox{width:min(430px,100%);padding:35px;border-radius:24px}.loginbox h1{margin:0 0 8px;font-size:2rem}.hint{color:var(--muted);font-size:13px;line-height:1.6}.error{color:#ff8fa3;min-height:24px;margin-top:8px;font-size:13px}.reveal{animation:reveal .65s both}@keyframes reveal{from{opacity:0;transform:translateY(18px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{display:block}.live{text-align:left;margin-top:15px}.navin{align-items:flex-start}.navbtns{flex-wrap:wrap;justify-content:flex-end}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:15px;min-height:110px}.value{font-size:1.8rem}.navbtn{padding:8px}.navbtn span{display:none}.page{padding:24px 12px 45px}.formShell{padding:17px;border-radius:19px}.section{padding:15px}.formtable{font-size:12px}}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const Icon=({name})=><img src={'/assets/icons/'+name+'.svg'} aria-hidden="true"/>;
function Spotlight(){useEffect(()=>{const f=e=>document.documentElement.style.setProperty('--mx',e.clientX+'px')||document.documentElement.style.setProperty('--my',e.clientY+'px');window.addEventListener('pointermove',f);return()=>window.removeEventListener('pointermove',f)},[]);return <div className="spot"/>}
function ShinyText({children}){return <span style={{background:'linear-gradient(110deg,#fff 35%,#68e4e0 50%,#fff 65%)',backgroundSize:'250% 100%',WebkitBackgroundClip:'text',color:'transparent',animation:'shine 3s linear infinite'}}>{children}</span>}
function GlassCard({children,className=''}){return <article className={'glass '+className}>{children}</article>}
const emptyStats={surveys:0,stations:0,allowed:0,denied:0};
function Dashboard(){const[d,setD]=useState({stats:emptyStats,provinces:[],recent:[],updatedAt:new Date().toISOString()});const load=async()=>{try{const r=await fetch('/api/dashboard',{cache:'no-store'});if(r.ok)setD(await r.json())}catch(e){}};useEffect(()=>{load();const t=setInterval(load,30000);return()=>clearInterval(t)},[]);const max=Math.max(...d.provinces.map(x=>x.count),1);return <main className="page reveal"><div className="hero"><div><div className="eyebrow">FIELD SERVICE / LIVE OPERATIONS</div><h1><ShinyText>Survey Dashboard</ShinyText></h1><div className="sub">ศูนย์ควบคุมงานสำรวจและบันทึกการเข้าพื้นที่</div></div><div className="live"><span className="dot"/>LIVE DATA<br/>{new Date(d.updatedAt).toLocaleString('th-TH')}</div></div><div className="cards"><GlassCard className="card"><small>ผลสำรวจทั้งหมด</small><span className="value blue">{d.stats.surveys}</span></GlassCard><GlassCard className="card"><small>สถานีในระบบ</small><span className="value cyan">{d.stats.stations}</span></GlassCard><GlassCard className="card"><small>อนุญาตเข้าพื้นที่</small><span className="value green">{d.stats.allowed}</span></GlassCard><GlassCard className="card"><small>ไม่อนุญาตเข้าพื้นที่</small><span className="value pink">{d.stats.denied}</span></GlassCard></div><div className="grid"><GlassCard className="panel"><h2>พื้นที่ที่มีการสำรวจสูงสุด</h2><div className="bars">{d.provinces.length?d.provinces.map(x=><div className="bar" key={x.name}><span>{x.name}</span><span className="track"><span className="fill" style={{width:(x.count/max*100)+'%'}}/></span><strong>{x.count}</strong></div>):<div className="empty">ยังไม่มีข้อมูล</div>}</div></GlassCard><GlassCard className="panel"><h2>รายการสำรวจล่าสุด</h2><div className="tablewrap"><table className="table"><thead><tr><th>รหัสรายการ</th><th>สถานี</th><th>จังหวัด</th><th>ผล</th><th>เวลาบันทึก</th></tr></thead><tbody>{d.recent.length?d.recent.map(x=><tr key={x.recordId}><td>{x.recordId}</td><td>{x.station}</td><td>{x.province}</td><td><span className={'badge '+(x.permit==='อนุญาต'?'ok':x.permit==='ไม่อนุญาต'?'no':'')}>{x.permit}</span></td><td>{new Date(x.savedAt).toLocaleString('th-TH')}</td></tr>):<tr><td colSpan="5" className="empty">ยังไม่มีผลสำรวจ</td></tr>}</tbody></table></div></GlassCard></div></main>}
function Field(){const[stations,setStations]=useState([]);const[msg,setMsg]=useState('');const[token]=useState(()=>sessionStorage.getItem('surveyToken')||'');const [form,setForm]=useState({});useEffect(()=>{fetch('/database',{headers:{Authorization:'Bearer '+token}}).then(r=>r.ok?r.json():Promise.reject()).then(x=>setStations(x.stations.map(s=>({village:s.village,subdistrict:s.subdistrict,district:s.district,province:s.province,installationPlace:s.installation_place,equipmentPlace:s.equipment_place,contactName:s.contact_name,contactPosition:s.contact_position})))).catch(()=>{})},[]);const set=(k,v)=>setForm(f=>({...f,[k]:v}));const station=useMemo(()=>stations.find(x=>x.village===form.station),[stations,form.station]);useEffect(()=>{if(station)setForm(f=>({...f,installationPlace:station.installationPlace,equipmentPlace:station.equipmentPlace,contactName:station.contactName,contactPosition:station.contactPosition}))},[station]);const submit=async e=>{e.preventDefault();setMsg('กำลังบันทึกข้อมูล...');try{const photos=await Promise.all([...e.target.photos.files].map(file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:file.name,type:file.type,data:r.result.split(',')[1]});r.onerror=rej;r.readAsDataURL(file)})));const fields={...form};const r=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({fields,photos})});if(!r.ok)throw Error();const x=await r.json();setMsg('บันทึกข้อมูล '+x.recordId+' เรียบร้อยแล้ว');e.target.reset();setForm({})}catch(x){setMsg('บันทึกข้อมูลไม่สำเร็จ')}};const inp=(id,label,type='text',extra={})=><div className="field"><label>{label}</label><input className="input" id={id} type={type} value={form[id]||''} onChange={e=>set(id,e.target.value)} {...extra}/></div>;const ta=(id,label)=><div className="field"><label>{label}</label><textarea className="input" id={id} value={form[id]||''} onChange={e=>set(id,e.target.value)}/></div>;return <main className="page reveal"><form className="formShell" onSubmit={submit}><div className="eyebrow">FIELD VISIT / SITE RECORD</div><h1 className="formTitle">แบบบันทึกเข้าตรวจเยี่ยมเจ้าของพื้นที่</h1><div className="section"><h2>01 · ข้อมูลสถานี</h2><div className="field"><label>ชื่อสถานี</label><input className="input" list="stations" required value={form.station||''} onChange={e=>set('station',e.target.value)}/><datalist id="stations">{stations.map((s,i)=><option key={i} value={s.village}/>)}</datalist></div>{inp('installationPlace','สถานที่ติดตั้ง')} {inp('equipmentPlace','สถานที่วางเครื่อง')} {inp('visitDate','วันที่เข้าพื้นที่','date')} {inp('visitTime','เวลาเข้าพื้นที่','time')}</div><div className="section"><h2>02 · ผู้ให้ข้อมูลในพื้นที่</h2>{inp('contactName','ชื่อ - สกุล')} {inp('contactPosition','ตำแหน่ง')} {inp('contactVillage','หน่วยงาน / หมู่บ้าน')} {inp('contactPhone','เบอร์โทรศัพท์','tel')}</div><div className="section"><h2>03 · การขออนุญาตเข้าพื้นที่</h2><div className="field"><label>ได้รับอนุญาตให้ดำเนินการหรือไม่</label><div className="radio"><label><input type="radio" name="permit" value="อนุญาต" checked={form.permit==='อนุญาต'} onChange={e=>set('permit',e.target.value)}/> อนุญาต</label><label><input type="radio" name="permit" value="ไม่อนุญาต" checked={form.permit==='ไม่อนุญาต'} onChange={e=>set('permit',e.target.value)}/> ไม่อนุญาต</label></div></div>{ta('accessLimit','ข้อจำกัดในการเข้าพื้นที่')}</div><div className="section"><h2>04 · สอบถามการใช้งาน</h2><table className="formtable"><thead><tr><th>หัวข้อ</th><th>คำตอบ</th></tr></thead><tbody>{[['radioStatus','สามารถใช้งานเครื่องวิทยุได้ตามปกติ',['ปกติ','ไม่ปกติ']],['receiveStatus','พบปัญหาการรับสัญญาณ',['ไม่พบ','พบ']],['transmitStatus','พบปัญหาการส่งสัญญาณ',['ไม่พบ','พบ']],['powerStatus','ระบบไฟฟ้ามีปัญหาหรือไม่',['ไม่มี','มี']],['batteryStatus','แบตเตอรี่สำรองมีปัญหาหรือไม่',['ไม่มี','มี']]].map(a=><tr key={a[0]}><td>{a[1]}</td><td><select className="input" value={form[a[0]]||a[2][0]} onChange={e=>set(a[0],e.target.value)}>{a[2].map(v=><option key={v}>{v}</option>)}</select></td></tr>)}</tbody></table>{ta('userProblem','ปัญหาเพิ่มเติมที่ผู้ใช้งานแจ้ง')}</div><div className="section"><h2>05 · สภาพแวดล้อมหน้างาน</h2>{ta('siteCondition','สภาพพื้นที่ติดตั้งอุปกรณ์')}{ta('antennaCondition','สภาพเสาอากาศและสายอากาศที่มองเห็นได้จากพื้น')}{ta('workObstacle','อุปสรรคในการปฏิบัติงาน')}</div><div className="section"><h2>06 · ภาพถ่ายก่อนดำเนินงาน</h2><div className="field"><label>อัปโหลดรูปภาพหน้างาน</label><input className="input" name="photos" type="file" multiple accept="image/*"/></div></div><div className="section"><h2>07 · ยืนยันข้อมูล</h2>{ta('summary','สรุปสิ่งที่ได้รับแจ้งจากเจ้าของพื้นที่')}{inp('informantName','ชื่อผู้ให้ข้อมูล')}{inp('operatorName','ชื่อผู้ปฏิบัติงาน')}</div><button className="primary" type="submit">บันทึกข้อมูล</button><span className="status">{msg}</span></form></main>}
function App(){const[page,setPage]=useState(location.pathname==='/dashboard'?'dashboard':'field');const[token,setToken]=useState(sessionStorage.getItem('surveyToken')||'');const[pass,setPass]=useState('');const[err,setErr]=useState('');const login=async e=>{e.preventDefault();setErr('กำลังตรวจสอบ...');try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});if(!r.ok)throw Error();const t=(await r.json()).token;sessionStorage.setItem('surveyToken',t);setToken(t);setPage(location.pathname==='/dashboard'?'dashboard':'field')}catch(x){setErr('รหัสผ่านไม่ถูกต้องหรือเซิร์ฟเวอร์ไม่พร้อมใช้งาน')}};const go=p=>{setPage(p);history.pushState({},'',p==='dashboard'?'/dashboard':'/html')};if(!token)return <><Spotlight/><div className="login"><form className="loginbox glass reveal" onSubmit={login}><div className="brand"><Icon name="dashboard"/><div><small>SURVEY CONTROL ROOM</small>NBTC MICROWAVE</div></div><h1>เข้าสู่ระบบ</h1><div className="hint">เข้าสู่ระบบเพื่อใช้งาน Dashboard และแบบบันทึก Field Visit</div><div className="field"><label>รหัสผ่าน</label><input className="input" type="password" value={pass} onChange={e=>setPass(e.target.value)} required autoFocus/></div><button className="primary">เข้าสู่ระบบ</button><div className="error">{err}</div></form></div></>;return <div className="app"><Spotlight/><nav className="nav"><div className="navin"><div className="brand"><Icon name="dashboard"/><div><small>SURVEY CONTROL ROOM</small>NBTC MICROWAVE</div></div><div className="navbtns"><button className={'navbtn '+(page==='dashboard'?'active':'')} onClick={()=>go('dashboard')}><Icon name="dashboard"/><span>Dashboard</span></button><button className={'navbtn '+(page==='field'?'active':'')} onClick={()=>go('field')}><Icon name="field-visit"/><span>Field Visit / Site Record</span></button><button className="navbtn logout" onClick={()=>{sessionStorage.removeItem('surveyToken');setToken('')}}><Icon name="logout"/><span>ออกจากระบบ</span></button></div></div></nav>{page==='dashboard'?<Dashboard/>:<Field/>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><style>@keyframes shine{to{background-position:-250% 0}}</style></body></html>
