[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["access-password.txt", "DATABASE.xlsx"]

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/.netlify/functions/api/login"
  status = 200
  force = true

[[redirects]]
  from = "/database"
  to = "/.netlify/functions/api/database"
  status = 200
  force = true

[[redirects]]
  from = "/save"
  to = "/.netlify/functions/api/save"
  status = 200
  force = true

[[redirects]]
  from = "/api/dashboard"
  to = "/.netlify/functions/api/dashboard"
  status = 200
  force = true

[[redirects]]
  from = "/access-password.txt"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/survey.db"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/DATABASE.xlsx"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/SURVEY_DATA.xlsx"
  to = "/404"
  status = 404
  force = true
